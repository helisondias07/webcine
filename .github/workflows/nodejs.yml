name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:cors
      - run: npm run build
        env:
          CI: true
          NODE_ENV: production

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  release-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
        env:
          CI: true
          NODE_ENV: production
          VITE_APP_NAME: WebCineTV
          VITE_SERVER_HOST: ""
          VITE_OAUTH_REDIRECT_HOSTNAME: https://webcinetv.com.br
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_SIGNIN_METHODS: google,email
      - name: Create backend .env
        run: |
          cat > .env << 'ENVEOF'
          PORT=8080
          HOST=0.0.0.0
          FRONTEND_URL=https://webcinetv.com.br
          CORS_ALLOWED_ORIGINS=http://localhost:5173,https://webcinetv.com.br,https://www.webcinetv.com.br
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          FIREBASE_ADMIN_SDK_CONFIG=${{ secrets.FIREBASE_ADMIN_SDK_CONFIG }}
          VITE_FIREBASE_SIGNIN_METHODS=google,email
          VBROWSER_DISABLED=true
          ENVEOF
      - name: Push to remote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "watchparty+github-actions[bot]@users.noreply.github.com"
          rm .gitignore
          git checkout -b release
          git add --all
          git commit --quiet -m "Built from ${{ github.sha }}"
          git push origin release -f
