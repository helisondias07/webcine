    <meta
      name="twitter:description"
      content="Crie uma sala de cinema online, convide seus amigos e assistam juntos em tempo real. Sem instalar nada, sem criar conta e gratis."
    />
    <meta
      name="twitter:image"
      content="https://webcinetv.com.br/og-image.jpg"
    />
    <title>WebCineTV - Sua sala de cinema online</title>
    <script>
      (function () {
        // Start in the same theme React will use (stored preference, default
        // light) to avoid a theme flash before hydration.
        var mode = "light";
        try {
          var stored = window.localStorage.getItem("webcinetv-theme-preference");
          if (stored === "dark" || stored === "light") {
            mode = stored;
          }
        } catch (_e) {}
        document.documentElement.setAttribute("data-mantine-color-scheme", mode);
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Room routes: swap the (prerendered) landing for a light room skeleton
      // so the Home content never flashes before the room chunk loads.
      (function () {
        var p = window.location.pathname;
        if (p.indexOf("/watch/") !== 0 && p.indexOf("/r/") !== 0) {
          return;
        }
        var root = document.getElementById("root");
        if (!root) {
          return;
        }
        root.innerHTML =
          '<div class="wc-skel" role="status" aria-live="polite" aria-label="Carregando sala">' +
          '<div class="wc-skel-top"><span class="wc-skel-brand">WEBCINE<i>tv</i></span></div>' +
          '<div class="wc-skel-deck"><div class="wc-skel-bar"></div></div>' +
          '<div class="wc-skel-player"><div class="wc-skel-spinner"></div></div>' +
          "</div>";
      })();
    </script>
